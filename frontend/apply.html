<!DOCTYPE html>
<html>

<head>
    <title>Apply for Funding</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Apply for Funding</h1>

<nav>
<a href="index.html">Home</a> |
<a href="grants.html">Grants</a> |
<a href="apply.html">Apply</a> |
<a href="dashboard.html">Dashboard</a>
</nav>

<div class="card">

<form onsubmit="submitApplication(event)">

<p><strong>Project Name</strong></p>
<input type="text" id="project" required>

<p><strong>Short Pitch</strong></p>
<input type="text" id="pitch"
placeholder="One sentence describing your project" required>

<p><strong>Project Description</strong></p>
<textarea id="description" rows="6" required></textarea>

<p><strong>Problem Statement</strong></p>
<textarea id="problem" rows="4" required></textarea>

<p><strong>Solution</strong></p>
<textarea id="solution" rows="4" required></textarea>

<p><strong>Blockchain</strong></p>
<input type="text" id="blockchain"
placeholder="Ethereum, Base, Optimism..." required>

<p><strong>Funding Requested</strong></p>
<input type="text" id="funding"
placeholder="10 ETH ou 5000 USDC" required>

<p><strong>Milestone 1</strong></p>
<input type="text" id="milestone1">

<p><strong>Milestone 2</strong></p>
<input type="text" id="milestone2">

<p><strong>Milestone 3</strong></p>
<input type="text" id="milestone3">

<p><strong>GitHub Repository</strong></p>
<input type="url" id="github">

<p><strong>Website</strong></p>
<input type="url" id="website">

<p><strong>Demo Video</strong></p>
<input type="url" id="video">

<p><strong>Wallet Address</strong></p>
<input type="text" id="wallet">

<br><br>

<button type="submit">
Submit Application
</button>

</form>

</div>

<div style="text-align:center; margin-top:25px;">
<a href="grants.html">⬅ Back to Grants</a>
</div>

<script>
function submitApplication(event){

    event.preventDefault();

    const application = {
    project: document.getElementById("project").value,
    pitch: document.getElementById("pitch").value,
    description: document.getElementById("description").value,
    problem: document.getElementById("problem").value,
    solution: document.getElementById("solution").value,
    blockchain: document.getElementById("blockchain").value,
    funding: document.getElementById("funding").value,
    milestone1: document.getElementById("milestone1").value,
    milestone2: document.getElementById("milestone2").value,
    milestone3: document.getElementById("milestone3").value,
    github: document.getElementById("github").value,
    website: document.getElementById("website").value,
    video: document.getElementById("video").value,
    wallet: document.getElementById("wallet").value,
    status: "Draft",
    date: new Date().toLocaleString()
};

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    applications.push(application);

    localStorage.setItem(
        "applications",
        JSON.stringify(applications)
    );

    alert("Application saved successfully!");

    document.querySelector("form").reset();

}
</script>

</body>

</html>
