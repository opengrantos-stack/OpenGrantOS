<!DOCTYPE html>
<html>

<head>
    <title>Apply for Funding</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Apply for Funding</h1>

<nav>
<a href="index.html">Home</a> |
<a href="grants.html">Grants</a> |
<a href="apply.html">Apply</a> |
<a href="dashboard.html">Dashboard</a>
</nav>

<div class="card">

<form onsubmit="submitApplication(event)">

<p><strong>Project Name</strong></p>
<input type="text" id="project" required>

<p><strong>Project Description</strong></p>
<textarea id="description" rows="6" required></textarea>

<p><strong>Blockchain</strong></p>
<input type="text" id="blockchain" placeholder="Ethereum, Base, Polygon..." required>

<p><strong>Funding Requested</strong></p>
<input type="text" id="funding" placeholder="10 ETH ou 5000 USDC" required>

<p><strong>GitHub Repository</strong></p>
<input type="url" id="github">

<p><strong>Website</strong></p>
<input type="url" id="website">

<br><br>

<button type="submit">
Submit Application
</button>

</form>

</div>

<div style="text-align:center; margin-top:25px;">
<a href="grants.html">⬅ Back to Grants</a>
</div>

<script>
function submitApplication(event){

    event.preventDefault();

    const application = {
        project: document.getElementById("project").value,
        description: document.getElementById("description").value,
        blockchain: document.getElementById("blockchain").value,
        funding: document.getElementById("funding").value,
        github: document.getElementById("github").value,
        website: document.getElementById("website").value,
        date: new Date().toLocaleString()
    };

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    applications.push(application);

    localStorage.setItem(
        "applications",
        JSON.stringify(applications)
    );

    alert("Application saved successfully!");

    document.querySelector("form").reset();

}
</script>

</body>

</html>
