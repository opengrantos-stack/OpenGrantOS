<h1>Apply for Funding</h1>

<p>
Complete the form below to submit your project for funding.
</p>

<form>

<p>
<b>Project Name</b><br>
<input type="text" placeholder="Enter your project name">
</p>

<p>
<b>Team Name</b><br>
<input type="text" placeholder="Your team">
</p>

<p>
<b>Blockchain</b><br>
<input type="text" placeholder="Ethereum, Solana, Base...">
</p>

<p>
<b>Category</b><br>
<input type="text" placeholder="DeFi, Education, AI...">
</p>

<p>
<b>Funding Requested (USD)</b><br>
<input type="number" placeholder="5000">
</p>

<p>
<b>Wallet Address</b><br>
<input type="text" placeholder="0x...">
</p>

<p>
<b>GitHub Repository</b><br>
<input type="url" placeholder="https://github.com/...">
</p>

<p>
<b>Website</b><br>
<input type="url" placeholder="https://">
</p>

<p>
<b>Project Description</b><br>
<textarea rows="6" cols="40" placeholder="Describe your project"></textarea>
</p>

<button type="submit">
Submit Application
</button>

</form>

<hr>

<p style="text-align:center;">
OpenGrantOS • Funding Application Portal
</p>
