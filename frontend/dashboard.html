<!DOCTYPE html>
<html>

<head>
    <title>OpenGrant OS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>OpenGrant OS Dashboard</h1>

<hr>

<h2>Wallet Information</h2>

<p><strong>Address:</strong> <span id="wallet">Not Connected</span></p>

<p><strong>Network:</strong> <span id="network">Unknown</span></p>

<p><strong>Balance:</strong> <span id="balance">0 ETH</span></p>

<button onclick="loadWallet()">
Refresh Wallet
</button>

<hr>

<a href="index.html">⬅ Home</a>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.min.js"></script>

<script>

async function loadWallet(){

if(typeof window.ethereum==="undefined"){
alert("MetaMask not found.");
return;
}

const provider=new ethers.BrowserProvider(window.ethereum);

const accounts=await provider.send("eth_requestAccounts",[]);

const address=accounts[0];

document.getElementById("wallet").innerHTML=address;

const network=await provider.getNetwork();

document.getElementById("network").innerHTML=network.name;

const balance=await provider.getBalance(address);

document.getElementById("balance").innerHTML=
ethers.formatEther(balance)+" ETH";

}

</script>

</body>

</html>
