<!DOCTYPE html>
<html>

<head>
    <title>OpenGrant OS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>OpenGrant OS Dashboard</h1>

<hr>

<div class="card">

<h2>Wallet Information</h2>

<p><strong>Address:</strong> <span id="wallet">Not Connected</span></p>

<p><strong>Network:</strong> <span id="network">Unknown</span></p>

<p><strong>Balance:</strong> <span id="balance">Coming Soon</span></p>

<button onclick="loadWallet()">
Refresh Wallet
</button>

</div>
<div class="card">

<h2>My Applications</h2>

<div id="applications">
No applications submitted yet.
</div>

</div>

<hr>

<div style="text-align:center; margin-top:20px;">
    <a href="index.html">⬅ Home</a>
</div>

<script>
async function loadWallet() {

    if (!window.ethereum) {
        alert("MetaMask not found.");
        return;
    }

    try {

        const accounts = await window.ethereum.request({
            method: "eth_requestAccounts"
        });

        document.getElementById("wallet").textContent = accounts[0];

        const chainId = await window.ethereum.request({
            method: "eth_chainId"
        });

        document.getElementById("network").textContent = chainId;

        document.getElementById("balance").textContent =
            "Coming Soon";

    } catch (err) {
        alert("Error: " + err.message);
    }

}
function loadApplications(){

    const applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    const container =
        document.getElementById("applications");

    if(applications.length===0){
        container.innerHTML="No applications submitted yet.";
        return;
    }

    let html="";

    applications.forEach(app=>{

        html += `
        <hr>

        <p><strong>Project:</strong> ${app.project}</p>

        <p><strong>Blockchain:</strong> ${app.blockchain}</p>

        <p><strong>Funding:</strong> ${app.funding}</p>

<p><strong>Status:</strong> ${app.status}</p>

<p><strong>Date:</strong> ${app.date}</p>

        `;

    });

    container.innerHTML=html;

}
window.addEventListener("load", async function () {

    loadApplications();

    if (window.ethereum) {
        try {
            await loadWallet();
        } catch (e) {
            console.log("Wallet not connected automatically.");
        }
    }

});
</script>

</body>

</html>
